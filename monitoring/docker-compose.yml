---
# The monitoring stack: Prometheus, Grafana and Alertmanager.

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=http://${PUBLIC_IP}:9090/
      - --web.enable-lifecycle
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /monitoring/prometheus
        awslogs-stream: prometheus
        awslogs-create-group: "true"

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://${PUBLIC_IP}:3000/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    depends_on:
      - prometheus
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /monitoring/grafana
        awslogs-stream: grafana
        awslogs-create-group: "true"

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    container_name: alertmanager
    restart: unless-stopped
    expose:
      - "9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /monitoring/alertmanager
        awslogs-stream: alertmanager
        awslogs-create-group: "true"

# Replaces the v1 jaeger service in monitoring/docker-compose.yml

  jaeger:
    image: ${JAEGER_IMAGE}
    container_name: jaeger
    restart: unless-stopped
    ports:
      # Jaeger UI. Restricted to the admin IP by security group -- Jaeger has
      # no authentication of its own, exactly like Prometheus.
      - "16686:16686"
      # OTLP over HTTP: where the app pushes spans. VPC only.
      - "4318:4318"
    volumes:
      # Config directory, not the file: a single-file bind mount binds the
      # inode, and Ansible's atomic rename would leave the container reading a
      # file that no longer exists.
      - ./jaeger:/jaeger:ro
      # Badger storage. Bind mount rather than a named volume, because Docker
      # creates named volumes owned by root and this image runs as uid 10001.
      - ./jaeger-data:/badger
    command: ["--config", "/jaeger/config.yaml"]
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /monitoring/jaeger
        awslogs-stream: jaeger
        awslogs-create-group: "true"

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
