# Alert rules.
groups:
  - name: weather-app
    rules:
      # The error rate is a ratio of two counters: the number of 5xx responses
      # divided by the total number of responses. The second clause ensures that
      # the alert does not fire when the app is idle and the ratio is undefined.
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(flask_http_request_total{status=~"5.."}[5m]))
            /
            sum(rate(flask_http_request_total[5m]))
          ) > 0.05
          and
          sum(rate(flask_http_request_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Error rate above 5% on the weather app"
          description: >-
            {{ $value | humanizePercentage }} of requests returned 5xx over the
            last 5 minutes.

      # p95, not the average. An average hides the tail: ninety-nine fast
      # requests and one very slow one average out to something that looks
      # fine, while a real user waited ten seconds.
      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency above 1 second"
          description: "p95 is {{ $value | humanizeDuration }}."

      # `up` is generated by Prometheus itself, not by the target: 1 if the
      # last scrape succeeded, 0 if it failed. So this fires whether the app
      # crashed, nginx stopped, or a security group changed.
      - alert: AppDown
        expr: up{job="weather-app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The weather app is not answering scrapes"
          description: >-
            Prometheus cannot reach {{ $labels.instance }}/metrics. The
            container may be down, or the security group may have changed.

  - name: hosts
    rules:
      # Scoped to the node job so it cannot overlap with AppDown. One incident
      # should produce one alert; two rules covering the same failure produce
      # two messages about one problem.
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} is not reporting metrics"
          description: >-
            node_exporter on {{ $labels.instance }} has not answered for two
            minutes. Either the host is down or node_exporter has stopped.