# Prometheus configuration.
#
# Prometheus PULLS: every target below exposes a plain HTTP page of numbers and
# Prometheus fetches it on a schedule. Nothing is pushed to Prometheus, which is
# why the monitoring host must be able to reach each target's port, and why the
# security groups allow the VPC CIDR on 9100 / 8080 / 9113.
#
# Target ADDRESSES are not listed here. They live in /etc/prometheus/targets/,
# generated by Ansible from the EC2 dynamic inventory, and are re-read
# automatically without a restart. That keeps this file static — it is a
# deliverable — while the addresses stay accurate after any rebuild.

global:
  scrape_interval: 15s # how often to pull each target
  evaluation_interval: 15s # how often to evaluate alert rules
  scrape_timeout: 10s

  # Attached to every series this server collects. Useful once you federate or
  # send to remote storage and need to know where a sample came from.
  external_labels:
    monitor: weather-app-observability
    region: eu-west-1

# Alert rules. Prometheus evaluates these itself and shows PENDING/FIRING in
# its own Alerts tab, so the >5% error-rate alert is demonstrable without
# running Alertmanager. Alertmanager is what would route a firing alert to
# email or Slack — deliberately out of scope here; Grafana handles notification.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Prometheus itself ----------------------------------------------------
  # Self-monitoring. Answers "is my monitoring healthy?" — scrape durations,
  # TSDB size, samples ingested, rule evaluation failures.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # --- host metrics ---------------------------------------------------------
  # node_exporter on all three hosts: CPU, memory, disk, load, network.
  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node.json"]

  # --- the application ------------------------------------------------------
  # Scraped THROUGH nginx on port 80, not on gunicorn's 8000. The app container
  # is expose-only, and nginx restricts /metrics to the VPC CIDR — so there is
  # one ingress port and access control sits where the real client IP is
  # visible. This job provides the three metrics the project requires:
  # latency, requests per second, and error rate.
  - job_name: weather-app
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/weather-app.json"]

  # --- containers -----------------------------------------------------------
  # cAdvisor: per-container CPU, memory, network, filesystem. This is what
  # tells you WHICH container is consuming a host's resources, where
  # node_exporter only tells you that something is.
  - job_name: cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/targets/cadvisor.json"]

  # --- reverse proxy --------------------------------------------------------
  # nginx stub_status via nginx-prometheus-exporter: connections accepted,
  # handled, active, and total requests at the proxy layer.
  - job_name: nginx
    file_sd_configs:
      - files: ["/etc/prometheus/targets/nginx.json"]

  # --- CI/CD ----------------------------------------------------------------
  # Requires the Prometheus metrics plugin installed in Jenkins. If the plugin
  # is absent this target simply shows DOWN; nothing else is affected.
  - job_name: jenkins
    metrics_path: /prometheus/
    file_sd_configs:
      - files: ["/etc/prometheus/targets/jenkins.json"]
