---
global:

  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  receiver: discord

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/webhook_url
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts }}**{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          Severity: `{{ .Labels.severity }}` — Instance: `{{ .Labels.instance }}`

          [Traces](http://108.129.218.59:16686/search?service=weather-app&tags=%7B%22error%22%3A%22true%22%7D) · [Dashboard](http://108.129.218.59:3000/d/weather-app-obs) · [Alert](http://108.129.218.59:9090/alerts)
          {{ end }}