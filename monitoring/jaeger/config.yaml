# Jaeger v2 configuration.
#
# v2 is built on the OpenTelemetry Collector, so this file has the Collector's
# shape: receivers take data in, processors transform it, exporters send it on,
# and extensions provide everything else (storage, the query UI, health checks).
# A `service` block at the top wires them into pipelines.
#
# This replaces the eight environment variables v1 needed. More lines, but each
# one is explicit and greppable, and the same format later accepts a metrics
# pipeline if the app is ever moved to OTLP metrics.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        # Jaeger's own metrics, in Prometheus format. Prometheus can scrape
        # this to answer "is my tracing backend healthy?" -- the same
        # self-monitoring principle as scraping Prometheus itself.
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: main_store
    base_path: /
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685

  jaeger_storage:
    backends:
      main_store:
        badger:
          # Embedded key-value store on local disk. Traces survive a container
          # restart without running a separate storage cluster. Elasticsearch
          # or Cassandra would be the choice at scale; neither fits alongside
          # Prometheus and Grafana on a t3.small.
          directories:
            keys: /badger/key
            values: /badger/data
          ephemeral: false
          ttl:
            spans: 72h

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        # Where the weather app pushes spans. Reachable from inside the VPC
        # only -- an open ingest port would let anyone inject fabricated
        # traces into the observability data.
        endpoint: 0.0.0.0:4318

processors:
  # Buffers spans and sends them to storage in batches rather than one write
  # per span. The same reasoning as BatchSpanProcessor in the application.
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: main_store