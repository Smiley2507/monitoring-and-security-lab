---
# Remote interpreter. AL2023 ships Python 3.9 as /usr/bin/python3; pinning it
# stops discovery drifting between runs.
ansible_python_interpreter: /usr/bin/python3

# --- pinned versions -------------------------------------------------------
# Pinned so a rebuild months from now installs what was tested.
node_exporter_version: "1.8.2"
docker_compose_version: "v2.32.4"
prometheus_image: "prom/prometheus:v3.1.0"
grafana_image: "grafana/grafana:11.5.1"
# --- monitoring host layout -------------------------------------------------
monitoring_dir: /opt/monitoring

# --- credentials ------------------------------------------------------------
# Lab-grade defaults. In anything real these belong in ansible-vault:
#   ansible-vault encrypt_string 'realpassword' --name 'grafana_admin_password'
grafana_admin_user: admin
grafana_admin_password: "changeme-grafana"

# --- scraping ---------------------------------------------------------------
scrape_interval: 15s

# --- CloudWatch logs --------------------------------------------------------
aws_region: eu-west-1

## --- Discord webhook for Alertmanager ---------------------------------------
# The webhook URL contains a token that grants the ability to post to the
# channel, so it is treated as a credential: kept in an untracked secrets file,
# and this task runs with no_log.
alertmanager_image: "prom/alertmanager:v0.28.0"
alertmanager_discord_webhook: "CHANGE-ME"

#-- Jaeger image. The all-in-one image is fine for a lab, but production would
#   use a more robust deployment with a storage backend. 
jaeger_image: "jaegertracing/jaeger:2.20.0"