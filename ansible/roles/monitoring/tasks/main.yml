---
- name: Create the monitoring directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"
  loop:
    - "{{ monitoring_dir }}"
    - "{{ monitoring_dir }}/prometheus"
    - "{{ monitoring_dir }}/prometheus/rules"
    - "{{ monitoring_dir }}/grafana"
    - "{{ monitoring_dir }}/alertmanager"
    - "{{ monitoring_dir }}/jaeger"

# --- Prometheus -------------------------------------------------------------

- name: Template the Prometheus configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../monitoring/prometheus/prometheus.yml.j2"
    dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  notify: Reload Prometheus

- name: Ship the alert rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/prometheus/rules/"
    dest: "{{ monitoring_dir }}/prometheus/rules/"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  notify: Reload Prometheus

# --- Grafana ----------------------------------------------------------------

- name: Ship the Grafana provisioning tree
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/"
    dest: "{{ monitoring_dir }}/grafana/provisioning/"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
    directory_mode: "0755"

# --- Alertmanager -----------------------------------------------------------

- name: Ship the Alertmanager configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/alertmanager/alertmanager.yml"
    dest: "{{ monitoring_dir }}/alertmanager/alertmanager.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"


- name: Write the Discord webhook URL
  ansible.builtin.copy:
    content: "{{ alertmanager_discord_webhook }}"
    dest: "{{ monitoring_dir }}/alertmanager/webhook_url"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  no_log: true

- name: Create the Jaeger storage directory with container-matching ownership
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/jaeger-data"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"

- name: Ship the Jaeger configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/jaeger/config.yaml"
    dest: "{{ monitoring_dir }}/jaeger/config.yaml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
# --- the stack --------------------------------------------------------------

- name: Ship the compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/docker-compose.yml"
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"

- name: Template the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_dir }}/.env"
    owner: ec2-user
    group: ec2-user
    mode: "0644"

- name: Pull images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ monitoring_dir }}"
  changed_when: false

- name: Start the monitoring stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ monitoring_dir }}"
  changed_when: true

# --- verification -----------------------------------------------------------

- name: Wait for Prometheus to be ready
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    status_code: [200]
    timeout: 10
  register: prom_ready
  retries: 20
  delay: 5
  until: prom_ready is succeeded

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/health
    status_code: [200]
    timeout: 10
  register: grafana_ready
  retries: 20
  delay: 5
  until: grafana_ready is succeeded


- name: Ask Prometheus how many targets are up
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/query?query=sum(up)
    return_content: true
    timeout: 10
  register: targets_up
  retries: 5
  delay: 10
  until: targets_up is succeeded

- name: Report scrape health
  ansible.builtin.debug:
    msg: >-
      Targets currently UP:
      {{ targets_up.json.data.result[0].value[1] | default('0') }} of 6.
      Full detail at http://{{ ansible_host }}:9090/targets

- name: Print the access URLs
  ansible.builtin.debug:
    msg:
      - "Grafana:    http://{{ ansible_host }}:3000/  (login {{ grafana_admin_user }})"
      - "Prometheus: http://{{ ansible_host }}:9090/  (no auth; restricted by security group)"
      - "Alerts:     http://{{ ansible_host }}:9090/alerts"
      - "Targets:    http://{{ ansible_host }}:9090/targets"