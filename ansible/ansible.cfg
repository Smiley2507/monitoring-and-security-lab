[defaults]
inventory        = ./inventory.aws_ec2.yml
roles_path       = ./roles
remote_user      = ec2-user

# The monitoring host reuses the CI/CD stack's key pair, so one key opens all
# three hosts. Adjust this path if your CI/CD checkout is named differently.
private_key_file = ../../jenkins-cicd-lab/terraform/cicd-key.pem

host_key_checking = False
interpreter_python = auto_silent

# community.general.yaml was removed in v12; this is the replacement.
# The ini key is `callback_result_format`, not `result_format`.
stdout_callback        = default
callback_result_format = yaml
callbacks_enabled      = profile_tasks

retry_files_enabled = False
forks               = 10

[inventory]
enable_plugins         = amazon.aws.aws_ec2
any_unparsed_is_failed = True

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=no